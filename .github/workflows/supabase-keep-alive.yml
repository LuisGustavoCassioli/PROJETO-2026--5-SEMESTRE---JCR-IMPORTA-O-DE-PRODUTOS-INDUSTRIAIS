name: Supabase Keep Alive

on:
  schedule:
    # Roda todo dia às 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Disparo manual para testar agora

jobs:
  ping:
    name: Ping Supabase API
    runs-on: ubuntu-latest
    steps:
      - name: Validar secrets obrigatórios
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "❌ ERRO: Secret SUPABASE_URL não configurado no GitHub!"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "❌ ERRO: Secret SUPABASE_ANON_KEY não configurado no GitHub!"
            exit 1
          fi
          echo "✅ Secrets encontrados. Iniciando ping..."

      - name: Ping Supabase REST API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "📡 HTTP Status retornado: $HTTP_STATUS"

          # Qualquer resposta HTTP (inclusive 401/403) prova que o servidor está ativo.
          # Só falha se: status=0 (sem conexão) ou 5xx (erro de servidor/banco pausado).
          if [ "$HTTP_STATUS" -eq 0 ]; then
            echo "❌ FALHOU: Sem resposta do Supabase — banco pode estar pausado ou URL errada!"
            exit 1
          elif [ "$HTTP_STATUS" -ge 500 ]; then
            echo "❌ FALHOU: Supabase retornou HTTP $HTTP_STATUS — erro interno no servidor!"
            exit 1
          fi

          echo "✅ SUCESSO: Supabase está ATIVO (HTTP $HTTP_STATUS) em $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
