name: Supabase Keep Alive

on:
  schedule:
    # Roda todo dia às 12:00 UTC (09h horário de Brasília)
    - cron: '0 12 * * *'
  workflow_dispatch: # Disparo manual para testar

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Validar secrets obrigatórios
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "❌ ERRO: Secret SUPABASE_URL não configurado!"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "❌ ERRO: Secret SUPABASE_ANON_KEY não configurado!"
            exit 1
          fi
          echo "✅ Secrets OK."

      - name: Executar query real no banco
        run: |
          # SELECT real na tabela products — isso conta como atividade pro Supabase
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            --max-time 15 \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/products?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Prefer: count=none")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "📡 HTTP Status: $HTTP_STATUS"
          echo "📦 Response: $BODY"

          if [ "$HTTP_STATUS" -eq 0 ]; then
            echo "❌ FALHOU: Sem conexão — banco pode estar pausado!"
            exit 1
          elif [ "$HTTP_STATUS" -ge 500 ]; then
            echo "❌ FALHOU: Erro interno HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "✅ SUCESSO: Query executada (HTTP $HTTP_STATUS) em $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
